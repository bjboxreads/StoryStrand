name: Build Android APK
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flutter and Flet
        run: |
          pip install flet
          flet Python setup dependencies

      - name: Build APK
        run: |
          flet build apk main.py --no-interactive

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
