name: Make upload keystore (run once)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore upload-keystore.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=StoryStrand, O=StoryStrand, C=US"
          base64 -w 0 upload-keystore.jks > keystore-base64.txt

      - name: Save keystore files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: |
            upload-keystore.jks
            keystore-base64.txt
          retention-days: 7
