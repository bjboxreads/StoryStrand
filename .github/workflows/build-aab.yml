name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install "flet[all]==0.28.3"

      - name: Install app dependencies
        run: pip install -r requirements.txt

      - name: Build AAB
        run: yes | flet build aab --project "StoryStrand" --org com.storystrand.app

      - name: Save AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryStrand-aab
          path: build/aab/*.aab
          if-no-files-found: error

      - name: Upload AAB to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
