name: Build AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install "flet[all]==0.28.3"

      - name: Install app dependencies
        run: pip install -r requirements.txt

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          if [ ! -s "$RUNNER_TEMP/upload-keystore.jks" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing or empty."
            exit 1
          fi

      - name: Build AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          yes | flet build aab \
            --project "StoryStrand" \
            --org com.storystrand.app \
            --build-number ${{ github.run_number }} \
            --android-signing-key-store "$RUNNER_TEMP/upload-keystore.jks" \
            --android-signing-key-store-password "$KEYSTORE_PASSWORD" \
            --android-signing-key-password "$KEYSTORE_PASSWORD" \
            --android-signing-key-alias upload

      - name: Verify bundle is release-signed
        run: |
          keytool -printcert -jarfile build/aab/*.aab | head -n 8
          if keytool -printcert -jarfile build/aab/*.aab | grep -q "Android Debug"; then
            echo "ERROR: bundle is still signed with the debug key."
            exit 1
          fi

      - name: Save AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryStrand-aab
          path: build/aab/*.aab
          if-no-files-found: error

      - name: Upload AAB to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
