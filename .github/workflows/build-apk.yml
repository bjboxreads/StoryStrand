name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install "flet[all]==0.85.3"

      - name: Install app dependencies
        run: pip install -r requirements.txt

      - name: Build APK
        run: yes | flet build apk --project "StoryStrand" --org com.storystrand.app

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: storystrand-apk
          path: build/apk/*.apk
